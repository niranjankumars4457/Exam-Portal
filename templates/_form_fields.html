{% for field in form %}
  <div class="field{% if field.field.widget.input_type == 'checkbox' %} check-row{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
      {{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="errors">{{ error }}</div>{% endfor %}
  </div>
{% endfor %}
